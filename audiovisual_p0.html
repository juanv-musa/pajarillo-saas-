<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fondo Audiovisual · Centro de Interpretación Santuario Ibérico de “El Pajarillo” (TV 65")</title>

  <meta name="description" content="Sala audiovisual interactiva en pantalla completa para TV 65 y tótem expositivo del Centro de Interpretación Santuario Ibérico de El Pajarillo.">

  <!-- Google Fonts: Barlow Condensed (estilo DIN Condensed corporativo) & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos de Sala Audiovisual TV 65" -->
  <link rel="stylesheet" href="./css/audiovisual.css">
</head>
<body>

  <!-- Fondo dinámico sutil -->
  <div class="tv-background-glow"></div>

  <!-- ═══════════════════════════════════════════
       MODO SALVAPANTALLAS INTERACTIVO (VIDEO RESUMEN EN BUCLE)
       ═══════════════════════════════════════════ -->
  <div id="tv-screensaver" class="tv-screensaver active" role="button" tabindex="0" aria-label="Modo salvapantallas. Toca para explorar documentales">
    <div class="tv-screensaver-video-wrap">
      <video id="tv-screensaver-video" class="tv-screensaver-video" playsinline muted loop preload="auto">
        Tu navegador no soporta vídeo HTML5.
      </video>
    </div>
    <div class="tv-screensaver-overlay">
      <div class="tv-screensaver-header">
        <img src="./assets/images/logo-pajarillo.png" alt="Centro de Interpretación Santuario Ibérico de “El Pajarillo”" class="tv-logo-pajarillo">
        <img src="./assets/images/logo-ayuntamiento-huelma.png" alt="Ayuntamiento de Huelma" class="tv-logo-ayto">
      </div>
      <div class="tv-screensaver-center">
        <h1 class="tv-screensaver-title">SANTUARIO IBÉRICO DE “EL PAJARILLO”</h1>
        <div class="tv-screensaver-prompt">
          <span class="tv-screensaver-hand">👆</span>
          <span>Toca la pantalla para comenzar</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedor Principal Kiosco (Menú de los 4 Vídeos) -->
  <div class="tv-app-shell">
    
    <!-- Cabecera Institucional Mínima: Logotipo Centro y Logotipo Ayuntamiento -->
    <header class="tv-header">
      <div class="tv-brand-wrap">
        <img src="./assets/images/logo-pajarillo.png" alt="Centro de Interpretación Santuario Ibérico de “El Pajarillo”" class="tv-logo-pajarillo">
        <img src="./assets/images/logo-ayuntamiento-huelma.png" alt="Ayuntamiento de Huelma" class="tv-logo-ayto">
        <div class="tv-brand-titles">
          <h1>Santuario Ibérico de “El Pajarillo”</h1>
        </div>
      </div>
      <div class="tv-header-actions">
        <button type="button" id="btn-trigger-screensaver" class="tv-btn-screensaver" title="Activar modo salvapantallas">
          <span>📺 Salvapantallas</span>
        </button>
      </div>
    </header>

    <!-- Zona Central: Parrilla limpia de los 4 Vídeos Documentales -->
    <main class="tv-main-content">
      <!-- Inyectado por js/audiovisual.js: (foto, tiempo, título) sin texto resumen ni duplicación de botones -->
      <div id="tv-video-grid" class="tv-grid-4"></div>
    </main>

    <!-- Pie Informativo Minimalista -->
    <footer class="tv-footer">
      <div class="tv-instructions">
        <span>👆 Toca cualquier documental para reproducir en pantalla</span>
      </div>
      <div>
        <span>Centro de Interpretación Santuario Ibérico de El Pajarillo · Excmo. Ayuntamiento de Huelma</span>
      </div>
    </footer>

  </div>

  <!-- ═══════════════════════════════════════════
       REPRODUCTOR CINEMATOGRÁFICO DE PANTALLA COMPLETA
       ═══════════════════════════════════════════ -->
  <div id="tv-player-modal" class="tv-player-modal" role="dialog" aria-modal="true" aria-label="Reproductor audiovisual">
    
    <!-- Barra superior flotante -->
    <div class="tv-player-topbar">
      <button type="button" id="btn-back-menu" class="btn-back-menu" aria-label="Volver al menú de vídeos">
        ← Volver a la Selección de Vídeos
      </button>
      <div id="tv-playing-title" class="tv-current-playing-title">Cargando contenido...</div>
    </div>

    <!-- Contenedor del Vídeo -->
    <div class="tv-video-container">
      <video id="tv-video" class="tv-video-element" playsinline preload="auto">
        Tu pantalla o navegador no soporta reproducción de vídeo HTML5.
      </video>
    </div>

    <!-- Barra de Controles Táctiles Gigantes -->
    <div class="tv-player-controls">
      <!-- Línea de tiempo interactiva -->
      <div id="tv-progress-bar" class="tv-timeline-bar-wrap" role="slider" aria-label="Barra de progreso" tabindex="0">
        <div id="tv-progress-fill" class="tv-timeline-bar-fill"></div>
      </div>

      <div class="tv-controls-row">
        <div class="tv-controls-left">
          <button type="button" id="tv-btn-play" class="tv-btn-control" aria-label="Reproducir o pausar">⏸</button>
          <button type="button" id="tv-btn-replay" class="tv-btn-control" aria-label="Reiniciar desde el inicio">↺</button>
          <button type="button" id="tv-btn-mute" class="tv-btn-control" aria-label="Activar o desactivar sonido">🔊</button>
          
          <div class="tv-time-indicator">
            <span id="tv-time-current">00:00</span> / <span id="tv-time-total">00:00</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Telemetría y Analítica Real -->
  <script type="module" src="./js/analytics.js"></script>
  <!-- Controlador Lógico -->
  <script src="./js/audiovisual.js?v=3.1"></script>
</body>
</html>

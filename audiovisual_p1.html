<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fondo Audiovisual 2 (Planta Alta) · Centro de Interpretación Santuario Ibérico de “El Pajarillo” (TV 65")</title>

  <meta name="description" content="Sala audiovisual interactiva en pantalla completa para TV 65 de la Planta Alta del Centro de Interpretación Santuario Ibérico de El Pajarillo.">

  <!-- Favicon Oficial Multidispositivo -->
  <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="./favicon.ico">

  <!-- Google Fonts: Barlow Condensed & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos de Sala Audiovisual TV 65" -->
  <link rel="stylesheet" href="./css/audiovisual.css">
  <style>
    /* Parrilla centrada de 2 vídeos de la Planta Alta */
    .tv-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(360px, 500px));
      gap: 2.5rem;
      justify-content: center;
      align-items: stretch;
      width: 100%;
      max-width: 1060px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      .tv-grid-2 {
        grid-template-columns: 1fr;
        max-width: 480px;
      }
    }
  </style>
</head>
<body>

  <!-- Fondo dinámico sutil -->
  <div class="tv-background-glow"></div>

  <!-- ═══════════════════════════════════════════
       MODO SALVAPANTALLAS INTERACTIVO (VIDEO RESUMEN EN BUCLE)
       ═══════════════════════════════════════════ -->
  <div id="tv-screensaver" class="tv-screensaver" role="button" tabindex="0" aria-label="Modo salvapantallas. Toca para explorar documentales">
    <div class="tv-screensaver-video-wrap">
      <video id="tv-screensaver-video" class="tv-screensaver-video" playsinline muted loop preload="auto">
        Tu navegador no soporta vídeo HTML5.
      </video>
    </div>
    <div class="tv-screensaver-overlay">
      <div class="tv-screensaver-header">
        <img src="./assets/images/10_LOGO_PAJARILLO_BLANCO.png" alt="Centro de Interpretación Santuario Ibérico de “El Pajarillo”" class="tv-logo-pajarillo">
        <img src="./assets/images/logo-ayuntamiento-huelma.png" alt="Ayuntamiento de Huelma" class="tv-logo-ayto">
      </div>
      <div class="tv-screensaver-center">
        <h1 class="tv-screensaver-title">SANTUARIO IBÉRICO DE “EL PAJARILLO”</h1>
        <div class="tv-screensaver-prompt">
          <span class="tv-screensaver-hand">👆</span>
          <span>Toca para reproducir · Touch to play · Touchez pour visionner</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedor Principal Kiosco (Menú de los 2 Vídeos) -->
  <div class="tv-app-shell">
    
    <!-- Cabecera Institucional Mínima: Logotipo Centro y Logotipo Ayuntamiento -->
    <header class="tv-header">
      <div class="tv-brand-wrap">
        <img src="./assets/images/10_LOGO_PAJARILLO_BLANCO.png" alt="Centro de Interpretación Santuario Ibérico de “El Pajarillo”" class="tv-logo-pajarillo">
        <img src="./assets/images/logo-ayuntamiento-huelma.png" alt="Ayuntamiento de Huelma" class="tv-logo-ayto">
        <div class="tv-brand-titles">
          <h1>Santuario Ibérico de “El Pajarillo”</h1>
        </div>
      </div>
    </header>

    <!-- Zona Central: Parrilla limpia de los 2 Vídeos -->
    <main class="tv-main-content">
      <div id="tv-video-grid" class="tv-grid-2"></div>
    </main>

    <!-- Pie Informativo Minimalista Trilingüe -->
    <footer class="tv-footer">
      <div class="tv-instructions">
        <span>👆 Toca para reproducir · Touch to play · Touchez pour visionner</span>
      </div>
    </footer>

  </div>

  <!-- ═══════════════════════════════════════════
       REPRODUCTOR CINEMATOGRÁFICO DE PANTALLA COMPLETA
       ═══════════════════════════════════════════ -->
  <div id="tv-player-modal" class="tv-player-modal" role="dialog" aria-modal="true" aria-label="Reproductor audiovisual">
    
    <!-- Barra superior flotante -->
    <div class="tv-player-topbar">
      <button type="button" id="btn-back-menu" class="btn-back-menu" aria-label="Volver a la selección de vídeos">
        ← Menú de Opciones
      </button>

      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <span class="badge-loop" style="background: rgba(77, 133, 209, 0.25); border: 1px solid rgba(118, 160, 220, 0.5); color: #94BDF2; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; letter-spacing: 0.5px;">
          🔄 BUCLE CONTINUO
        </span>
        <button type="button" id="btn-toggle-audiodesc" class="btn-toggle-audiodesc" style="background: rgba(46, 125, 50, 0.9); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: all 0.2s ease;">
          👁️ Audiodescripción 🇪🇸
        </button>
      </div>

      <div id="tv-playing-title" class="tv-current-playing-title">Cargando contenido...</div>
    </div>

    <!-- Contenedor del Vídeo -->
    <div class="tv-video-container">
      <video id="tv-video" class="tv-video-element" playsinline loop preload="auto">
        Tu pantalla o navegador no soporta reproducción de vídeo HTML5.
      </video>
      <!-- Aviso flotante para activar sonido si el navegador inició silenciado -->
      <button type="button" id="tv-unmute-overlay" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 19, 0.92); border: 2px solid #D4AF37; color: #fff; padding: 18px 36px; border-radius: 999px; font-size: 1.3rem; font-weight: 800; cursor: pointer; z-index: 50; box-shadow: 0 12px 40px rgba(0,0,0,0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: center; gap: 12px;">
        <span style="font-size: 1.6rem;">🔊</span>
        <span>Toca la pantalla para activar el sonido</span>
      </button>
    </div>

    <!-- Barra de Controles Táctiles Gigantes -->
    <div class="tv-player-controls">
      <!-- Línea de tiempo interactiva -->
      <div id="tv-progress-bar" class="tv-timeline-bar-wrap" role="slider" aria-label="Barra de progreso" tabindex="0">
        <div id="tv-progress-fill" class="tv-timeline-bar-fill"></div>
      </div>

      <div class="tv-controls-row">
        <div class="tv-controls-left">
          <button type="button" id="tv-btn-play" class="tv-btn-control" aria-label="Reproducir o pausar">⏸</button>
          <button type="button" id="tv-btn-replay" class="tv-btn-control" aria-label="Reiniciar desde el inicio">↺</button>
          <button type="button" id="tv-btn-mute" class="tv-btn-control" aria-label="Activar o desactivar sonido">🔊</button>
          
          <div class="tv-time-indicator">
            <span id="tv-time-current">00:00</span> / <span id="tv-time-total">00:00</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Telemetría y Analítica Real -->
  <script type="module" src="./js/analytics.js"></script>
  <!-- Controlador Lógico de Planta 1 -->
  <script src="./js/audiovisual_p1.js?v=4.2"></script>
</body>
</html>
